<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streaks">
<meta name="theme-color" content="#0a0a0a">
<title>Streaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #666;
    --accent: #d4f57a;
    --accent-dim: rgba(212,245,122,0.12);
    --accent-text: #0a0a0a;
    --danger: #ff5a5a;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100dvh; overscroll-behavior: none; }
  #app { max-width: 430px; margin: 0 auto; padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 100px); min-height: 100dvh; }

  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
  .header-title { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .header-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat-val { font-size: 22px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }

  .section-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .activity-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

  .activity-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; align-items: center; gap: 14px;
    transition: border-color 0.15s, background 0.15s; cursor: pointer;
    user-select: none; -webkit-user-select: none; position: relative; overflow: hidden;
  }
  .activity-card.done { border-color: rgba(212,245,122,0.25); background: rgba(212,245,122,0.04); }
  .activity-card.done::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 3px 0 0 3px; }

  .activity-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .activity-card.done .activity-icon { background: var(--accent-dim); }
  .activity-info { flex: 1; min-width: 0; }
  .activity-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .activity-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .streak-badge { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); background: var(--accent-dim); padding: 2px 8px; border-radius: 6px; }
  .streak-badge.zero { color: var(--muted); background: var(--surface2); }
  .activity-freq { font-size: 11px; color: var(--muted); }

  .week-dots-row { display: flex; gap: 5px; align-items: flex-end; }
  .dot-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); transition: background 0.15s; }
  .dot.filled { background: var(--accent); opacity: 0.85; }
  .dot.today.filled { opacity: 1; }
  .dot.today { outline: 1.5px solid var(--muted); outline-offset: 1px; }
  .dot-lbl { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; }

  .check-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; cursor: pointer; }
  .activity-card.done .check-btn { background: var(--accent); border-color: var(--accent); }
  .check-icon { color: var(--accent); font-size: 16px; }
  .activity-card.done .check-icon { color: var(--accent-text); }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; padding: 12px 20px calc(var(--safe-bottom) + 12px); background: rgba(10,10,10,0.9); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; background: none; border: none; cursor: pointer; padding: 6px 16px; border-radius: 10px; transition: color 0.15s; }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 20px; }
  .add-fab { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--accent-text); font-weight: 300; line-height: 1; box-shadow: 0 0 20px rgba(212,245,122,0.3); transition: transform 0.15s; }
  .add-fab:active { transform: scale(0.93); }

  /* Overlay + Sheet */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { background: var(--surface); border-radius: 24px 24px 0 0; width: 100%; max-width: 430px; padding: 24px 24px calc(var(--safe-bottom) + 24px); border-top: 1px solid var(--border); animation: slideUp 0.25s ease; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .sheet-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .sheet-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; margin-top: -14px; }

  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; display: block; }
  .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.15s; }
  .form-input:focus { border-color: var(--accent); }

  /* Emoji grid */
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .emoji-btn { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid transparent; background: var(--surface2); font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
  .emoji-btn.selected { border-color: var(--accent); background: var(--accent-dim); }

  /* Frequency */
  .freq-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .freq-btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .freq-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  /* Custom days picker */
  .custom-picker { margin-top: 12px; display: none; align-items: center; gap: 12px; }
  .custom-picker.visible { display: flex; }
  .custom-picker label { font-size: 13px; color: var(--muted); }
  .day-stepper { display: flex; align-items: center; gap: 10px; }
  .stepper-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .stepper-val { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--accent); min-width: 24px; text-align: center; }

  /* Edit history button */
  .btn-history { width: 100%; padding: 12px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; transition: background 0.15s; }
  .btn-history:active { background: var(--border); }

  /* Sheet actions */
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-primary { flex: 1; padding: 14px; background: var(--accent); color: var(--accent-text); border: none; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:active { opacity: 0.85; }
  .btn-cancel { padding: 14px 20px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .btn-danger { padding: 14px 20px; background: rgba(255,90,90,0.1); color: var(--danger); border: 1px solid rgba(255,90,90,0.2); border-radius: 12px; font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; }

  /* Calendar sheet */
  .cal-nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-nav-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; color: var(--text); font-size: 20px; cursor: pointer; line-height: 1; }
  .cal-month-label { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .cal-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .cal-legend span { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; }
  .leg-dot.on { background: var(--accent); }
  .leg-dot.off { background: var(--surface2); border: 1px solid var(--border); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 20px; }
  .cal-dow { text-align: center; font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; padding-bottom: 6px; }
  .cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: 'DM Mono', monospace; cursor: pointer; background: var(--surface2); color: var(--muted); border: 1px solid transparent; transition: all 0.12s; user-select: none; -webkit-user-select: none; }
  .cal-day.empty { background: transparent; cursor: default; border: none; }
  .cal-day.on { background: var(--accent-dim); color: var(--accent); border-color: rgba(212,245,122,0.25); font-weight: 500; }
  .cal-day.today { border-color: var(--muted); color: var(--text); }
  .cal-day.today.on { border-color: var(--accent); }
  .cal-day.future { opacity: 0.2; cursor: not-allowed; }
  .cal-day:not(.empty):not(.future):active { transform: scale(0.88); }

  /* History view */
  .history-view { display: none; }
  .history-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .history-icon { font-size: 20px; width: 36px; text-align: center; }
  .history-name { font-size: 14px; flex: 1; }
  .history-date { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

  .empty-state { text-align: center; color: var(--muted); padding: 48px 0 24px; font-size: 14px; line-height: 1.7; }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="header-title">Streaks 🔥</div>
      <div class="header-date" id="today-label"></div>
    </div>
  </div>
  <div class="summary">
    <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">Activities</div></div>
    <div class="stat"><div class="stat-val" id="stat-done">0</div><div class="stat-lbl">Done today</div></div>
    <div class="stat"><div class="stat-val" id="stat-best">0</div><div class="stat-lbl">Best streak</div></div>
  </div>
  <div id="today-view">
    <div class="section-label">Today</div>
    <div class="activity-list" id="activity-list">
      <div class="empty-state" id="empty-state"><div class="big">🌱</div>Add your first activity<br>and start building streaks.</div>
    </div>
  </div>
  <div id="history-view" class="history-view">
    <div class="section-label">Recent completions</div>
    <div id="history-list"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-today" onclick="showView('today')"><span class="nav-icon">⚡</span>Today</button>
  <button class="add-fab" onclick="openAddSheet()">+</button>
  <button class="nav-btn" id="nav-history" onclick="showView('history')"><span class="nav-icon">📅</span>Log</button>
</div>

<!-- Add / Edit Activity Sheet -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">New activity</div>

    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="input-name" type="text" placeholder="e.g. Morning run" maxlength="40">
    </div>

    <div class="form-group">
      <label class="form-label">Icon</label>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Frequency</label>
      <div class="freq-options" id="freq-options"></div>
      <div class="custom-picker" id="custom-picker">
        <label>Days per week:</label>
        <div class="day-stepper">
          <button class="stepper-btn" onclick="stepCustomDays(-1)">−</button>
          <div class="stepper-val" id="custom-days-val">3</div>
          <button class="stepper-btn" onclick="stepCustomDays(1)">+</button>
        </div>
      </div>
    </div>

    <!-- Edit history button — only shown when editing -->
    <div id="history-btn-wrap" style="display:none; margin-bottom: 4px;">
      <button class="btn-history" onclick="openCalFromEdit()">📅 &nbsp;Edit past days</button>
    </div>

    <div class="sheet-actions" id="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-primary" onclick="saveActivity()">Save</button>
    </div>
  </div>
</div>

<!-- Calendar Sheet -->
<div class="overlay" id="cal-overlay" onclick="handleCalOverlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="cal-title"></div>
    <div class="sheet-subtitle">Tap any past day to toggle complete / incomplete</div>

    <div class="cal-nav-row">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    </div>

    <div class="cal-legend">
      <span><div class="leg-dot on"></div>Done</span>
      <span><div class="leg-dot off"></div>Not done</span>
    </div>

    <div class="cal-grid" id="cal-grid"></div>

    <div class="sheet-actions">
      <button class="btn-cancel" style="flex:1" onclick="closeCalSheet()">Done</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = [
  '🏃','🚶','🧘','💪','🏋️','🚴','🏊','🤸','⛹️','🏄','🧗','🤾',
  '🥗','🥦','💧','🍎','🍵','☕','🥤','🍳','🥣','🫐',
  '📚','✍️','📝','🎯','🧠','💡','🔬','🧪','💻','📖','🗒️','✏️',
  '🎸','🎹','🎺','🎻','🥁','🎤','🎨','🖌️','📷','🎭','🎬','🎮',
  '😴','🛌','🧖','🛁','🪥','🧴','💊','🩺','🩹','❤️',
  '🐕','🐈','🌿','🌱','🌸','☀️','🌙','⭐','🔥','✨','🌈','🍀',
  '🧹','🧺','🪴','🏠','🔑','🛒','💰','💳','📦','🗓️','⏰','📬',
  '🤝','📞','✉️','🎁','🎉','🏆','🥇','🎖️','🙏','💬','👨‍👩‍👧','🫂'
];

const FREQS = ['Daily','Weekdays','Weekends','3x/week','4x/week','5x/week','Custom'];
const DOWS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let activities = JSON.parse(localStorage.getItem('streaks_v1') || '[]');
let log = JSON.parse(localStorage.getItem('streaks_log') || '[]');
let editingId = null;
let selectedEmoji = EMOJIS[0];
let selectedFreq = 'Daily';
let customDays = 3;
let calActivityId = null;
let calYear, calMonth;

function ds(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
const todayStr = () => ds(new Date());
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('en-US', {weekday:'short',month:'short',day:'numeric'});

function save() {
  localStorage.setItem('streaks_v1', JSON.stringify(activities));
  localStorage.setItem('streaks_log', JSON.stringify(log));
}

function getWeekTarget(a) {
  // Returns how many days/week are required, or null for day-based freqs
  if (a.freq === 'Daily') return null;
  if (a.freq === 'Weekdays') return null;
  if (a.freq === 'Weekends') return null;
  if (a.freq === '3x/week') return 3;
  if (a.freq === '4x/week') return 4;
  if (a.freq === '5x/week') return 5;
  if (a.freq === 'Custom') return a.customDays ?? 3;
  return null;
}

// Get Monday of the week containing a given date string
function weekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : 1 - day; // shift to Monday
  d.setDate(d.getDate() + diff);
  return ds(d);
}

function getStreak(id) {
  const act = activities.find(a => a.id === id);
  const dates = new Set(log.filter(e => e.id === id).map(e => e.date));
  if (!dates.size) return 0;

  const target = act ? getWeekTarget(act) : null;

  // ── Weekly-target mode (3x/week etc.) ──
  if (target !== null) {
    // Count total days completed that belong to a streak of consecutive qualifying weeks
    const today = new Date();
    const todayDs = ds(today);

    // Build a map of week-start -> count of completions that week
    const weekCounts = {};
    for (const d of dates) {
      const ws = weekStart(d);
      weekCounts[ws] = (weekCounts[ws] || 0) + 1;
    }

    // Walk backwards week by week from current week
    let cur = new Date(today);
    // Rewind to Monday of this week
    const todayDow = cur.getDay();
    const rewind = todayDow === 0 ? 6 : todayDow - 1;
    cur.setDate(cur.getDate() - rewind);

    let totalDays = 0;
    for (let w = 0; w < 104; w++) { // up to 2 years back
      const ws = ds(cur);
      const count = weekCounts[ws] || 0;
      const isCurrentWeek = w === 0;

      if (count >= target) {
        totalDays += count;
      } else if (isCurrentWeek) {
        // Current week not yet complete — still counts days so far, don't break
        totalDays += count;
      } else {
        break; // missed a past week — streak ends
      }

      cur.setDate(cur.getDate() - 7);
    }
    return totalDays;
  }

  // ── Daily / Weekdays / Weekends mode — original consecutive-day logic ──
  const today = todayStr();
  let streak = 0;
  let cur = new Date();
  for (let i = 0; i < 730; i++) {
    const d = ds(cur);
    const dow = cur.getDay();

    // Skip days that don't apply to this frequency
    const applies = act
      ? (act.freq === 'Weekdays' ? (dow >= 1 && dow <= 5)
       : act.freq === 'Weekends' ? (dow === 0 || dow === 6)
       : true)
      : true;

    if (applies) {
      if (dates.has(d)) { streak++; }
      else if (d === today) { /* today not yet done, skip */ }
      else break;
    }
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}

function getLast7(id) {
  const today = new Date();
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(today);
    d.setDate(d.getDate() - (6 - i));
    const dateStr = ds(d);
    return { dateStr, lbl: DOWS[d.getDay()][0], filled: log.some(e => e.id === id && e.date === dateStr), isToday: i === 6 };
  });
}

function isDoneToday(id) { return log.some(e => e.id === id && e.date === todayStr()); }

function freqLabel(a) {
  if (a.freq === 'Custom') return `${a.customDays ?? 3}x/week`;
  return a.freq;
}

function render() {
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  const list = document.getElementById('activity-list');
  list.innerHTML = '';

  if (!activities.length) {
    list.appendChild(document.getElementById('empty-state'));
    ['stat-total','stat-done','stat-best'].forEach(id => document.getElementById(id).textContent = '0');
    return;
  }

  const doneCount = activities.filter(a => isDoneToday(a.id)).length;
  const bestStreak = activities.reduce((m, a) => Math.max(m, getStreak(a.id)), 0);
  document.getElementById('stat-total').textContent = activities.length;
  document.getElementById('stat-done').textContent = doneCount;
  document.getElementById('stat-best').textContent = bestStreak;

  activities.forEach(a => {
    const done = isDoneToday(a.id);
    const streak = getStreak(a.id);
    const days7 = getLast7(a.id);

    const card = document.createElement('div');
    card.className = 'activity-card' + (done ? ' done' : '');

    const dotHtml = days7.map(d => `
      <div class="dot-col">
        <div class="dot${d.filled?' filled':''}${d.isToday?' today':''}"></div>
        <div class="dot-lbl">${d.lbl}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="activity-icon">${a.emoji}</div>
      <div class="activity-info">
        <div class="activity-name">${a.name}</div>
        <div class="activity-meta">
          <span class="streak-badge${streak===0?' zero':''}">🔥 ${streak}d</span>
          <span class="activity-freq">${freqLabel(a)}</span>
        </div>
        <div class="week-dots-row">${dotHtml}</div>
      </div>
      <button class="check-btn" onclick="toggleDone(event,'${a.id}')">
        <span class="check-icon">${done?'✓':''}</span>
      </button>`;

    card.addEventListener('click', e => {
      if (e.target.closest('.check-btn')) return;
      openEditSheet(a.id);
    });
    list.appendChild(card);
  });
}

function renderHistory() {
  const hl = document.getElementById('history-list');
  const recent = [...log].sort((a,b) => b.date.localeCompare(a.date)).slice(0,60);
  if (!recent.length) { hl.innerHTML = '<div class="empty-state"><div class="big">📭</div>No completions yet.</div>'; return; }
  hl.innerHTML = recent.map(e => {
    const act = activities.find(a => a.id === e.id);
    if (!act) return '';
    return `<div class="history-item"><div class="history-icon">${act.emoji}</div><div class="history-name">${act.name}</div><div class="history-date">${fmtDate(e.date)}</div></div>`;
  }).join('');
}

function toggleDone(event, id) {
  event.stopPropagation();
  const today = todayStr();
  const idx = log.findIndex(e => e.id === id && e.date === today);
  if (idx >= 0) { log.splice(idx, 1); }
  else {
    log.push({ id, date: today });
    const icon = event.currentTarget.closest('.activity-card').querySelector('.activity-icon');
    icon.style.animation = 'none'; icon.offsetHeight; icon.style.animation = 'pop 0.2s ease';
  }
  save(); render();
}

function showView(v) {
  document.getElementById('today-view').style.display = v === 'today' ? '' : 'none';
  document.getElementById('history-view').style.display = v === 'history' ? 'block' : 'none';
  document.getElementById('nav-today').className = 'nav-btn' + (v==='today'?' active':'');
  document.getElementById('nav-history').className = 'nav-btn' + (v==='history'?' active':'');
  if (v === 'history') renderHistory();
}

/* ── Emoji & Freq builders ── */
function buildEmojiGrid(sel) {
  document.getElementById('emoji-grid').innerHTML = EMOJIS.map(e =>
    `<button class="emoji-btn${e===sel?' selected':''}" onclick="selectEmoji('${e}')">${e}</button>`).join('');
}
function buildFreqOptions(sel) {
  document.getElementById('freq-options').innerHTML = FREQS.map(f =>
    `<button class="freq-btn${f===sel?' selected':''}" onclick="selectFreq('${f}')">${f}</button>`).join('');
  document.getElementById('custom-picker').className = 'custom-picker' + (sel==='Custom'?' visible':'');
}
function selectEmoji(e) { selectedEmoji = e; buildEmojiGrid(e); }
function selectFreq(f) {
  selectedFreq = f;
  buildFreqOptions(f);
}
function stepCustomDays(d) {
  customDays = Math.min(7, Math.max(1, customDays + d));
  document.getElementById('custom-days-val').textContent = customDays;
}

/* ── Add Sheet ── */
function openAddSheet() {
  editingId = null; selectedEmoji = EMOJIS[0]; selectedFreq = 'Daily'; customDays = 3;
  document.getElementById('sheet-title').textContent = 'New activity';
  document.getElementById('input-name').value = '';
  document.getElementById('history-btn-wrap').style.display = 'none';
  buildEmojiGrid(selectedEmoji); buildFreqOptions(selectedFreq);
  document.getElementById('custom-days-val').textContent = customDays;
  document.getElementById('sheet-actions').innerHTML = `<button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-primary" onclick="saveActivity()">Add activity</button>`;
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('input-name').focus(), 300);
}

/* ── Edit Sheet ── */
function openEditSheet(id) {
  const a = activities.find(x => x.id === id);
  if (!a) return;
  editingId = id; selectedEmoji = a.emoji; selectedFreq = a.freq; customDays = a.customDays ?? 3;
  document.getElementById('sheet-title').textContent = 'Edit activity';
  document.getElementById('input-name').value = a.name;
  document.getElementById('history-btn-wrap').style.display = 'block';
  buildEmojiGrid(selectedEmoji); buildFreqOptions(selectedFreq);
  document.getElementById('custom-days-val').textContent = customDays;
  document.getElementById('sheet-actions').innerHTML = `<button class="btn-danger" onclick="deleteActivity('${id}')">Delete</button><button class="btn-primary" onclick="saveActivity()">Save changes</button>`;
  document.getElementById('overlay').classList.add('open');
}

function closeSheet() { document.getElementById('overlay').classList.remove('open'); editingId = null; }
function handleOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeSheet(); }

function saveActivity() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) { document.getElementById('input-name').focus(); return; }
  if (editingId) {
    const a = activities.find(x => x.id === editingId);
    if (a) { a.name = name; a.emoji = selectedEmoji; a.freq = selectedFreq; a.customDays = customDays; }
  } else {
    activities.push({ id: Date.now().toString(), name, emoji: selectedEmoji, freq: selectedFreq, customDays });
  }
  save(); closeSheet(); render();
}

function deleteActivity(id) {
  if (!confirm('Delete this activity and all its history?')) return;
  activities = activities.filter(a => a.id !== id);
  log = log.filter(e => e.id !== id);
  save(); closeSheet(); render();
}

/* ── Calendar Sheet ── */
function openCalFromEdit() {
  if (!editingId) return;
  calActivityId = editingId;
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  const act = activities.find(a => a.id === calActivityId);
  document.getElementById('cal-title').textContent = `${act.emoji} ${act.name}`;
  renderCalGrid();
  document.getElementById('cal-overlay').classList.add('open');
}

function closeCalSheet() {
  document.getElementById('cal-overlay').classList.remove('open');
  render();
}
function handleCalOverlayClick(e) { if (e.target === document.getElementById('cal-overlay')) closeCalSheet(); }

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalGrid();
}

function renderCalGrid() {
  const today = todayStr();
  document.getElementById('cal-month-label').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = DOWS.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < firstDow; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const future = dateStr > today;
    const on = log.some(e => e.id === calActivityId && e.date === dateStr);
    const isToday = dateStr === today;
    const cls = ['cal-day', on?'on':'', isToday?'today':'', future?'future':''].filter(Boolean).join(' ');
    const click = future ? '' : `onclick="toggleCalDay('${dateStr}')"`;
    grid.innerHTML += `<div class="${cls}" ${click}>${d}</div>`;
  }
}

function toggleCalDay(dateStr) {
  const idx = log.findIndex(e => e.id === calActivityId && e.date === dateStr);
  if (idx >= 0) log.splice(idx, 1);
  else log.push({ id: calActivityId, date: dateStr });
  save(); renderCalGrid();
}

render();
</script>
